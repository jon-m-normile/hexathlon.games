<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Hexathlon — As You Wish</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --black:   #07080b;
      --dark:    #0d1018;
      --navy:    #111827;
      --gold:    #c9a84c;
      --gold-lt: #e5c97a;
      --gold-dk: #8a6d28;
      --cream:   #ede6d8;
      --muted:   #9e9585;
      --border:  rgba(201,168,76,0.2);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark);
      color: var(--cream);
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    header {
      text-align: center;
      padding: 5rem 1rem 3rem;
    }
    header h1 {
      font-family: 'Cinzel Decorative', serif;
      letter-spacing: 0.12em;
      color: var(--gold);
      font-size: clamp(1.8rem, 5vw, 3rem);
      line-height: 1.2;
    }
    header p {
      color: var(--muted);
      font-style: italic;
      margin-top: 1rem;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1rem 5rem;
      display: flex;
      flex-direction: column;
      gap: 3.5rem;
    }

    figure {
      border: 1px solid var(--border);
      background: var(--navy);
    }
    figure img {
      display: block;
      width: 100%;
      height: auto;
    }
    figcaption {
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .event {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.06em;
      color: var(--gold);
    }
    .scene { color: var(--muted); font-style: italic; }

    footer {
      text-align: center;
      padding: 0 1rem 4rem;
    }
    footer a {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.1em;
      color: var(--gold-dk);
      text-decoration: none;
    }
    footer a:hover { color: var(--gold-lt); }
  </style>
</head>
<body>
  <header>
    <h1>The First Hexathlon</h1>
    <p>Florin, some years ago. One man in black. Six events.</p>
  </header>

  <main>
    <figure>
      <img src="img/1-sailing.jpg" alt="The chase across the sea in sailing boats" />
      <figcaption><span class="event">I · Sailboat Racing</span><span class="scene">The chase across the sea</span></figcaption>
    </figure>
    <figure>
      <img src="img/2-climbing.jpg" alt="Looking down the Cliffs of Insanity at the Man in Black climbing" />
      <figcaption><span class="event">II · Sport Climbing</span><span class="scene">The Cliffs of Insanity</span></figcaption>
    </figure>
    <figure>
      <img src="img/3-fencing.jpg" alt="The duel between the Man in Black and Inigo Montoya" />
      <figcaption><span class="event">III · Fencing</span><span class="scene">The Man in Black vs. Inigo Montoya</span></figcaption>
    </figure>
    <figure>
      <img src="img/4-running.jpg" alt="The Man in Black running after the princess" />
      <figcaption><span class="event">IV · Running</span><span class="scene">The Man in Black in pursuit</span></figcaption>
    </figure>
    <figure>
      <img src="img/5-wrestling.jpg" alt="The wrestling match between the Man in Black and Fezzik" />
      <figcaption><span class="event">V · Sumo Wrestling</span><span class="scene">The Man in Black vs. Fezzik</span></figcaption>
    </figure>
    <figure>
      <img src="img/6-chess.jpg" alt="The battle of wits" />
      <figcaption><span class="event">VI · Speed Chess</span><span class="scene">The battle of wits</span></figcaption>
    </figure>
  </main>

  <footer>
    <a href="/">As you wish.</a>
  </footer>
</body>
</html>
